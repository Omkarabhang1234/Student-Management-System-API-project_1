<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
        function validateForm() {
            let password = document.getElementById("password").value;
            let confirmPassword = document.getElementById("confirmPassword").value;

            if (password !== confirmPassword) {
                alert("Password and Confirm Password must be same!");
                return false;
            }
            return true;
        }
    </script>
</head>

<body class="bg-light">

    <div class="container mt-5 mb-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h2 class="mb-0">⚙ Student Management System Settings</h2>
            </div>

            <div class="card-body p-4">

                <!-- Success Alert -->
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <span th:text="${success}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <!-- Error Alert -->
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <form th:action="@{/settings/save}" th:object="${settings}" method="post"
                    onsubmit="return validateForm()">

                    <input type="hidden" th:field="*{id}">

                    <!-- Admin Information -->
                    <h4 class="text-primary">👤 Admin Information</h4>
                    <hr>

                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Admin Name</label>
                         <input type="text"
       class="form-control"
       th:field="*{adminName}"
       placeholder="Omkar Abhang">
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Email</label>
                            <input type="email"
       class="form-control"
       th:field="*{email}"
       placeholder="omkar@gmail.com">
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Mobile</label>
                            <input type="text"
       class="form-control"
       th:field="*{mobile}"
       placeholder="9158084301">
                        </div>
                    </div>

                    <br>

                    <!-- System Settings -->
                    <h4 class="text-success">🏫 System Settings</h4>
                    <hr>

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Application Name</label>
                            <input type="text" class="form-control" th:field="*{appName}">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">College Name</label>
                            <input type="text"
       class="form-control"
       th:field="*{collegeName}"
       placeholder="Your College Name">
                        </div>
                    </div>

                    <br>

                    <!-- Student Settings -->
                    <h4 class="text-warning">🎓 Student Settings</h4>
                    <hr>

                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Default Department</label>
                            <select class="form-select" th:field="*{defaultDepartment}">
                                <option value="Computer Science">Computer Science</option>
                                <option value="Information Technology">Information Technology</option>
                                <option value="Mechanical">Mechanical</option>
                                <option value="Civil">Civil</option>
                                <option value="Electronics">Electronics</option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Default City</label>
                            <input type="text" class="form-control" th:field="*{defaultCity}">
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Registration</label>
                            <select class="form-select" th:field="*{registrationEnabled}">
                                <option th:value="true">Enabled</option>
                                <option th:value="false">Disabled</option>
                            </select>
                        </div>
                    </div>

                    <br>

                    <!-- Appearance -->
                    <h4 class="text-info">🎨 Appearance</h4>
                    <hr>

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Theme</label>
                            <select class="form-select" th:field="*{theme}">
                                <option value="Light">Light</option>
                                <option value="Dark">Dark</option>
                            </select>
                        </div>
                    </div>

                    <br>

                    <!-- Security -->
                    <h4 class="text-danger">🔒 Security</h4>
                    <hr>

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Password</label>
                            <input id="password" type="password" class="form-control" th:field="*{password}" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Confirm Password</label>
                            <input id="confirmPassword" type="password" class="form-control"
                                th:field="*{confirmPassword}" required>
                        </div>
                    </div>

                    <br>

                    <!-- Form Action Buttons -->
                    <div class="text-center mt-4">
                        <button type="submit" class="btn btn-success btn-lg me-2">
                            💾 Save Settings
                        </button>
                        <button type="reset" class="btn btn-warning btn-lg me-2">
                            🔄 Reset
                        </button>
                        <a th:href="@{/dashboard}" href="/dashboard" class="btn btn-primary btn-lg">
                            🏠 Dashboard
                        </a>
                    </div>
                </form>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
