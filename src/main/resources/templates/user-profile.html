<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>User Profile</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f4f6f9;
}

.profile-card{
    max-width:900px;
    margin:40px auto;
    border:none;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

.profile-header{
    background:#0d6efd;
    color:white;
    padding:25px;
    border-radius:15px 15px 0 0;
    text-align:center;
}

.profile-img{
    width:120px;
    height:120px;
    border-radius:50%;
    border:4px solid white;
    object-fit:cover;
    margin-bottom:10px;
}

.form-label{
    font-weight:600;
}

.btn-save{
    width:100%;
}

</style>

</head>

<body>

<div class="container">

<div class="card profile-card">

<div class="profile-header">

<img src="https://via.placeholder.com/120"
     class="profile-img">

<h3 th:text="${user.name}">Omkar Abhang</h3>

<p th:text="${user.role}">USER</p>

</div>

<div class="card-body">

<form th:action="@{/user/update-profile}"
      th:object="${user}"
      method="post">

<input type="hidden"
       th:field="*{id}">

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">
Full Name
</label>

<input type="text"
       class="form-control"
       th:field="*{name}">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">
Email
</label>

<input type="email"
       class="form-control"
       th:field="*{email}"
       readonly>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">
Role
</label>

<input type="text"
       class="form-control"
       th:value="${user.role}"
       readonly>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">
Account Status
</label>

<input type="text"
       class="form-control"
       th:value="${user.enabled ? 'Active' : 'Inactive'}"
       readonly>

</div>

<div class="col-md-12 mb-3">

<label class="form-label">
New Password
</label>

<input type="password"
       class="form-control"
       name="password"
       placeholder="Enter new password">

</div>

<div class="col-md-12">

<button type="submit"
        class="btn btn-primary btn-save">

Update Profile

</button>

</div>

</div>

</form>

<hr>

<div class="text-center">

<a th:href="@{/user/dashboard}"
   class="btn btn-secondary">

Back to Dashboard

</a>

<a th:href="@{/logout}"
   class="btn btn-danger">

Logout

</a>

</div>

</div>

</div>

</div>

</body>
</html>
